apiVersion: v1
kind: Pod
metadata:
  name: resources # pod name
  labels:
    project: roboshop
    
spec:
  containers:
  - name: nginx # container name
    image: nginx
resources:
  requests: # soft limit
        cpu: "100m" # 1000m is 1cpu
        memory: "128Mi"
  limits: # hard limit
        cpu: "150m"
        memory: "256Mi"