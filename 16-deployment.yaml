apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    project: roboshop
    tier: frontend
    component: frontend
    purpose: deployment
spec:
  replicas: 10
  selector:
    matchLabels:
      project: roboshop
      tier: frontend
      component: frontend
      purpose: deployment
  template:
    metadata:
      labels:
        project: roboshop
        tier: frontend
        component: frontend
        purpose: deployment
    spec:
      containers:
      - name: nginx
        image: nginx:latest 
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    project: roboshop
    tier: frontend
    component: frontend
    purpose: deployment
spec:
  selector:
    project: roboshop
    tier: frontend
    component: frontend
    purpose: deployment
    component: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
